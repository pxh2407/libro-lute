<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUTE · 15 anni di NOI</title>
  <meta name="description" content="Il libro per i 15 anni della LUTE di Milazzo, da sfogliare online: clicca su un titolo dell'indice per andare alla sua pagina.">
  <meta name="theme-color" content="#1b5e3f">
  <meta property="og:type" content="book">
  <meta property="og:title" content="LUTE · 15 anni di NOI">
  <meta property="og:description" content="Il libro per i 15 anni della LUTE di Milazzo, da sfogliare online, in italiano e in inglese.">
  <meta property="og:url" content="https://pxh2407.github.io/libro-lute/">
  <meta property="og:image" content="https://pxh2407.github.io/libro-lute/copertina.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="copertina.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="barra">
    <button class="barra__btn barra__btn--indice" id="btnIndice" aria-controls="pannello" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span id="etichettaIndice">Indice</span>
    </button>
    <a class="barra__titolo" href="#copertina"><img class="barra__logo" src="logo.png" alt="LUTE Milazzo"><span class="barra__testo" id="titolo">LUTE · <em>15 anni di NOI</em></span></a>
    <div class="lingue" role="group" aria-label="Lingua / Language">
      <button type="button" data-lingua="it" aria-pressed="true" lang="it">IT</button>
      <button type="button" data-lingua="en" aria-pressed="false" lang="en">EN</button>
    </div>
    <div class="barra__nav">
      <button class="barra__btn" id="btnPrima" aria-label="Pagina precedente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <form class="vai" id="vai">
        <label for="numPag" id="etichettaPag">Pag.</label>
        <input id="numPag" type="text" inputmode="numeric" autocomplete="off" aria-label="Vai alla pagina">
        <span id="totPag"></span>
      </form>
      <button class="barra__btn" id="btnDopo" aria-label="Pagina successiva">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="barra__zoom">
      <button class="barra__btn" id="zoomMeno" aria-label="Pagine più piccole">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button class="barra__btn" id="zoomPiu" aria-label="Pagine più grandi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
      </button>
    </div>
  </header>

  <aside class="pannello" id="pannello" aria-label="Indice del libro">
    <div class="pannello__testa">
      <h2 id="titoloIndice">Indice</h2>
      <button class="pannello__chiudi" id="btnChiudi" aria-label="Chiudi l'indice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ol class="elenco" id="elenco"></ol>
  </aside>
  <div class="velo" id="velo" hidden></div>

  <main class="libro" id="libro"></main>

  <script src="dati.js?v=2"></script>
  <script src="dati-en.js?v=2"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
